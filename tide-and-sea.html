async function loadPlace(p){
  const [w, m, u] = await Promise.allSettled([
    jget(weatherUrl(p)),
    jget(marineUrl(p)),
    inUKV(p) ? jget(ukvUrl(p)) : Promise.resolve(null)
  ]);
  const prev = data[p.id] || {};
  const rec = {
    weather: w.status === "fulfilled" ? w.value : (prev.weather || null),
    marine:  m.status === "fulfilled" ? m.value  : (prev.marine  || null),
    // High-resolution wind is a bonus, never a blocker — keep the last good one.
    ukv:     u.status === "fulfilled" && u.value ? u.value : (prev.ukv || null),
    fetchedAt: Date.now(),
    error: null
  };
  if (w.status === "rejected" && m.status === "rejected"){
    rec.error = String(w.reason && w.reason.message || w.reason);
    rec.fetchedAt = prev.fetchedAt || 0;
  } else if (w.status === "rejected" || m.status === "rejected"){
    rec.error = "partial";
  }
  data[p.id] = rec;
}

async function loadAll(){
  setUpdating(true);
  await Promise.all(state.places.map(p => loadPlace(p).catch(() => {})));
  setUpdating(false);
  await Store.set(K_CACHE, data);
  render();
}

/* ==================================================================
   Sewage watch — storm overflow activity within a radius of the place.
   ================================================================== */
function sewUrl(base, p, km){
  return base + "/query?f=json&where=1%3D1&geometry=" + p.lon + "," + p.lat +
    "&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects" +
    "&distance=" + (km*1000) + "&units=esriSRUnit_Meter" +
    "&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=250";
}

// Field names vary in case across companies (South West camelCases them, and
// ST Connect says LatestEventFinish) — fold everything to one shape.
function normSew(f, p){
  if (!f || !f.attributes) return null;
  const a = {};
  for (const k in f.attributes) a[k.toLowerCase()] = f.attributes[k];
  const lat = f.geometry && typeof f.geometry.y === "number" ? f.geometry.y : a.latitude;
  const lon = f.geometry && typeof f.geometry.x === "number" ? f.geometry.x : a.longitude;
  if (!isFinite(lat) || !isFinite(lon)) return null;
  const st = Number(a.status);
  const { d, b } = distBrg(p.lat, p.lon, lat, lon);
  return {
    id: a.id != null ? String(a.id) : "",
    company: a.company ? String(a.company) : "",
    status: isFinite(st) ? st : 0,           // 1 discharging · 0 not · -1 monitor offline
    start: a.latesteventstart || null,
    end: a.latesteventend || a.latesteventfinish || null,
    statusStart: a.statusstart || null,
    water: a.receivingwatercourse ? String(a.receivingwatercourse) : "",
    lat, lon, dist: d, brg: b
  };
}

function sewState(it, now){
  if (it.status === 1) return "active";
  if (it.status === -1) return "offline";
  const end = it.end || it.statusStart;
  if (end && now - end < SEW_RECENT_MS) return "recent";
  return "idle";
}

async function loadSewage(p, km){
  const results = await Promise.allSettled(SEWAGE_SOURCES.map(u => jget(sewUrl(u, p, km))));
  const items = [], seen = new Set();
  let failed = 0, firstErr = null;
  for (const r of results){
    if (r.status !== "fulfilled"){
      failed++;
      if (!firstErr) firstErr = String(r.reason && r.reason.message || r.reason);
      continue;
    }
    for (const f of (r.value && r.value.features) || []){
      const it = normSew(f, p);
      if (!it || it.dist > km * 1.2) continue;
      const key = sewKey(it);
      if (seen.has(key)) continue;
      seen.add(key);
      items.push(it);
    }
  }
  if (failed === SEWAGE_SOURCES.length){
    return { items: null, error: firstErr || "All feeds unreachable", fetchedAt: Date.now(), radius: km };
  }
  items.sort((a,b) => a.dist - b.dist);
  return { items, failed, fetchedAt: Date.now(), radius: km };
}

const sewLoading = new Set();
function ensureSewage(p){
  if (!p || !data[p.id] || sewLoading.has(p.id)) return;
  const s = data[p.id].sewage;
  if (s && s.radius === state.sewKm && Date.now() - (s.fetchedAt || 0) < REFRESH_MS) return;
  sewLoading.add(p.id);
  loadSewage(p, state.sewKm).then(rec => {
    sewLoading.delete(p.id);
    if (!data[p.id]) return;
    data[p.id].sewage = rec;
    Store.set(K_CACHE, data);
    if (state.activeId === p.id) render();
  }).catch(() => sewLoading.delete(p.id));
}

/* ==================================================================
   Beach layers — bathing water classifications and lifeguarded
   beaches, cached per place; rain radar frames, cached globally.
   ================================================================== */
function parseBw(j, p, km){
  const out = [];
  for (const f of (j && j.features) || []){
    const g = f.geometry && f.geometry.coordinates;
    const pr = f.properties || {};
    if (!g || g.length < 2) continue;
    // Some WFS servers honour urn axis order (lat first), some don't.
    const latFirst = g[0] >= 45 && g[0] <= 62 && Math.abs(g[1]) <= 12;
    const lat = latFirst ? g[0] : g[1], lon = latFirst ? g[1] : g[0];
    if (!isFinite(lat) || !isFinite(lon)) continue;
    let cls = null, yr = null;
    for (let y = 2035; y >= 2015; y--){
      const v = pr["class_" + y];
      if (v && v !== "un-assessed"){ cls = String(v); yr = y; break; }
    }
    const { d, b } = distBrg(p.lat, p.lon, lat, lon);
    if (d > km * 1.5) continue;
    out.push({ name: pr.bw_name ? String(pr.bw_name) : "Bathing water", ref: pr.bw_ref ? String(pr.bw_ref) : "", cls, yr, lat, lon, dist: d, brg: b });
  }
  out.sort((a, b2) => a.dist - b2.dist);
  return out;
}

function parseLg(j, p){
  const out = [];
  for (const f of (j && j.features) || []){
    if (!f.geometry || !f.attributes) continue;
    const lat = f.geometry.y, lon = f.geometry.x;
    if (!isFinite(lat) || !isFinite(lon)) continue;
    const { d, b } = distBrg(p.lat, p.lon, lat, lon);
    out.push({ name: f.attributes.Name ? String(f.attributes.Name) : "Lifeguarded beach", url: f.attributes.Beach_URL ? String(f.attributes.Beach_URL) : "", lat, lon, dist: d, brg: b });
  }
  out.sort((a, b2) => a.dist - b2.dist);
  return out;
}

function bwColor(cls){
  if (cls === "Excellent") return "var(--good)";
  if (cls === "Good") return "var(--shoal-deep)";
  if (cls === "Sufficient") return "var(--amber)";
  if (cls === "Poor") return "var(--mark)";
  return "var(--ink-3)";
}

const beachLoading = new Set();
function ensureBeach(p){
  if (!state.beach || !p || !data[p.id] || beachLoading.has(p.id)) return;
  const b = data[p.id].beach;
  // Classifications are annual and lifeguard cover seasonal — an hour's cache is plenty.
  if (b && b.radius === state.sewKm && Date.now() - (b.fetchedAt || 0) < 6 * REFRESH_MS) return;
  beachLoading.add(p.id);
  Promise.allSettled([ jget(bwUrl(p, state.sewKm)), jget(rnliUrl(p, state.sewKm)) ]).then(([bw, lg]) => {
    beachLoading.delete(p.id);
    if (!data[p.id]) return;
    data[p.id].beach = {
      bw: bw.status === "fulfilled" ? parseBw(bw.value, p, state.sewKm) : ((b && b.bw) || []),
      lg: lg.status === "fulfilled" ? parseLg(lg.value, p) : ((b && b.lg) || []),
      fetchedAt: Date.now(),
      radius: state.sewKm
    };
    Store.set(K_CACHE, data);
    if (state.activeId === p.id) render();
  }).catch(() => beachLoading.delete(p.id));
}

let rainData = null, rainTimer = null, rainLoading = false;
async function ensureRain(){
  if (!state.rain || rainLoading) return;
  if (rainData && Date.now() - rainData.fetchedAt < 5 * 60000) return;
  rainLoading = true;
  try {
    const j = await jget(RAIN_INDEX);
    const past = (j.radar && j.radar.past) || [];
    const cast = (j.radar && j.radar.nowcast) || [];
    rainData = {
      host: j.host || "https://tilecache.rainviewer.com",
      frames: [...past, ...cast],
      idx: Math.max(0, past.length - 1),
      playing: rainData ? rainData.playing : false,
      fetchedAt: Date.now()
    };
    renderSewMap();
  } catch {} finally { rainLoading = false; }
}

// RainViewer serves radar up to zoom 7 (512 px tiles double the detail).
// Beyond that we stretch the coarse tiles — the radar itself is ~1 km data,
// so over-zooming loses nothing real.
const RAIN_MAX_Z = 7;
function rainTileUrl(f, z, x, y){
  return rainData.host + f.path + "/512/" + z + "/" + x + "/" + y + "/2/1_1.png";
}

function rainTick(){
  const rd = rainData;
  if (!rd || !rd.frames.length) return;
  rd.idx = (rd.idx + 1) % rd.frames.length;
  const f = rd.frames[rd.idx];
  document.querySelectorAll("#sewmap img.rimg").forEach(img => {
    const [z, x, y] = img.dataset.t.split(",");
    img.src = rainTileUrl(f, z, x, y);
  });
  const t = document.querySelector("#sewmap .rtime");
  if (t) t.textContent = fmtT(f.time * 1000, sewMap.off);
}

/* ==================================================================
   Tide maths — Catmull-Rom through the hourly sea-level series, then
   hunt the turning points at one-minute resolution.
   ================================================================== */
function catmull(p0,p1,p2,p3,u){
  const u2=u*u, u3=u2*u;
  return 0.5*((2*p1) + (-p0+p2)*u + (2*p0-5*p1+4*p2-p3)*u2 + (-p0+3*p1-3*p2+p3)*u3);
}

// Building the minute-resolution curve is the priciest thing the page does,
// and callers ask for it on every render — memoise per response object.
const tideCache = new WeakMap();
function buildTide(marine){
  if (!marine || !marine.hourly || !marine.hourly.sea_level_height_msl) return null;
  if (tideCache.has(marine)) return tideCache.get(marine);
  const tide = buildTideUncached(marine);
  tideCache.set(marine, tide);
  return tide;
}
function buildTideUncached(marine){
  const off = marine.utc_offset_seconds || 0;
  const times = marine.hourly.time, raw = marine.hourly.sea_level_height_msl;

  // Keep only the contiguous run of real numbers.
  const t = [], h = [];
  for (let i = 0; i < times.length; i++){
    const v = raw[i];
    if (typeof v === "number" && isFinite(v)){ t.push(epochOf(times[i], off)); h.push(v); }
  }
  if (h.length < 8) return null;

  const step = 60000; // one minute
  const samples = [];
  for (let i = 0; i < h.length - 1; i++){
    const p0 = h[Math.max(0,i-1)], p1 = h[i], p2 = h[i+1], p3 = h[Math.min(h.length-1,i+2)];
    const span = t[i+1] - t[i];
    if (span <= 0 || span > 3*3600000) continue;
    for (let ms = 0; ms < span; ms += step){
      samples.push({ t: t[i] + ms, h: catmull(p0,p1,p2,p3, ms/span) });
    }
  }
  samples.push({ t: t[t.length-1], h: h[h.length-1] });
  if (samples.length < 60) return null;

  // Turning points, refined by fitting a parabola through the neighbours.
  const extrema = [];
  for (let i = 1; i < samples.length - 1; i++){
    const a = samples[i-1].h, b = samples[i].h, c = samples[i+1].h;
    if ((b > a && b >= c) || (b < a && b <= c)){
      const den = a - 2*b + c;
      const shift = den !== 0 ? clamp(0.5*(a-c)/den, -1, 1) : 0;
      extrema.push({
        t: samples[i].t + shift*step,
        h: b - 0.25*(a-c)*shift,
        type: (b > a) ? "HW" : "LW"
      });
    }
  }
  // Drop any pair closer than three hours — model noise, not a real tide.
  const clean = [];
  for (const e of extrema){
    const last = clean[clean.length-1];
    if (last && e.t - last.t < 3*3600000){
      if (last.type === e.type){ if ((e.type==="HW") ? e.h > last.h : e.h < last.h) clean[clean.length-1] = e; }
      continue;
    }
    clean.push(e);
  }
  return { samples, extrema: clean, off, t0: samples[0].t, t1: samples[samples.length-1].t };
}

function heightAt(tide, ep){
  // Binary search — the samples are ordered but not perfectly uniform when
  // the source series has gaps, so indexing by minute offset can misread.
  const s = tide.samples;
  if (ep <= s[0].t) return s[0].h;
  if (ep >= s[s.length-1].t) return s[s.length-1].h;
  let lo = 0, hi = s.length - 1;
  while (hi - lo > 1){
    const mid = (lo + hi) >> 1;
    if (s[mid].t <= ep) lo = mid; else hi = mid;
  }
  return s[lo].h;
}

/* ==================================================================
   The tide section — a cross-section of the water over the ground,
   not a line chart. Night is shaded, now is a magenta plumb line.
   ================================================================== */
function drawTide(el, tide, place, nights, hours){
  const W = Math.max(el.clientWidth || 640, 280);
  const H = W < 560 ? 200 : 260;
  const padL = 8, padR = 8, padT = 30, bedH = 16;
  const now = Date.now();
  const t0 = Math.max(tide.t0, now - (hours/4)*3600000);
  const t1 = Math.min(tide.t1, t0 + hours*3600000);
  const off = tide.off, D = place.datum || 0;

  const view = tide.samples.filter(s => s.t >= t0 && s.t <= t1);
  if (!view.length) { el.innerHTML = ""; return; }
  let lo = Infinity, hi = -Infinity;
  for (const s of view){ if (s.h < lo) lo = s.h; if (s.h > hi) hi = s.h; }
  const span = Math.max(hi - lo, 0.4), padV = span * 0.22;
  lo -= padV; hi += padV;

  const x = t => padL + (t - t0) / (t1 - t0) * (W - padL - padR);
  const y = h => padT + (hi - h) / (hi - lo) * (H - padT - bedH);

  let d = "";
  for (let i = 0; i < view.length; i += 2){
    d += (i === 0 ? "M" : "L") + x(view[i].t).toFixed(1) + " " + y(view[i].h).toFixed(1);
  }
  const last = view[view.length-1];
  d += "L" + x(last.t).toFixed(1) + " " + y(last.h).toFixed(1);
  const fill = d + `L${x(last.t).toFixed(1)} ${H} L${x(view[0].t).toFixed(1)} ${H} Z`;

  // Shade the hours of darkness.
  let bands = "";
  for (const n of nights){
    const a = Math.max(n[0], t0), b = Math.min(n[1], t1);
    if (b > a) bands += `<rect x="${x(a).toFixed(1)}" y="0" width="${(x(b)-x(a)).toFixed(1)}" height="${H}" fill="var(--night-band)"/>`;
  }

  // Six-hourly gridlines and their labels.
  let grid = "", labels = "";
  const startH = Math.ceil(t0 / (6*3600000)) * (6*3600000);
  for (let t = startH; t <= t1; t += 6*3600000){
    const px = x(t);
    grid += `<line x1="${px.toFixed(1)}" y1="${padT-6}" x2="${px.toFixed(1)}" y2="${H-bedH}" stroke="var(--rule-soft)" stroke-width="1"/>`;
    const lab = fmtT(t, off);
    labels += `<text x="${px.toFixed(1)}" y="${H-4}" fill="var(--ink-3)" font-size="9.5" text-anchor="middle"
      font-family="ui-monospace,Menlo,monospace" letter-spacing="0.5">${lab === "00:00" ? fmtD(t,off).toUpperCase() : lab}</text>`;
  }

  // High and low water marks.
  let marks = "";
  for (const e of tide.extrema){
    if (e.t < t0 || e.t > t1) continue;
    const px = x(e.t), py = y(e.h), up = e.type === "HW";
    const ty = up ? Math.max(py - 12, 14) : Math.min(py + 22, H - bedH - 6);
    const anchor = px < 44 ? "start" : px > W - 44 ? "end" : "middle";
    const dx = px < 44 ? 2 : px > W - 44 ? -2 : 0;
    marks += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.6" fill="var(--panel)" stroke="var(--ink-2)" stroke-width="1.4"/>`;
    marks += `<text x="${(px+dx).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" font-size="11"
      font-family="ui-monospace,Menlo,monospace" fill="var(--ink-2)">${fmtT(e.t,off)}<tspan fill="var(--ink-3)" font-size="10">  ${(e.h+D).toFixed(1)}</tspan></text>`;
  }

  // Now.
  let nowLayer = "";
  if (now >= t0 && now <= t1){
    const nx = x(now), ny = y(heightAt(tide, now));
    nowLayer = `
      <line x1="${nx.toFixed(1)}" y1="${(padT-10).toFixed(1)}" x2="${nx.toFixed(1)}" y2="${(H-bedH).toFixed(1)}" stroke="var(--mark)" stroke-width="1" stroke-dasharray="2 3" opacity=".75"/>
      <circle class="pulse" cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="7" fill="var(--mark)" opacity=".16"/>
      <circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="3.4" fill="var(--mark)"/>
      <text x="${clamp(nx,16,W-16).toFixed(1)}" y="${(padT-16).toFixed(1)}" text-anchor="${nx<40?"start":nx>W-40?"end":"middle"}"
        font-size="9.5" letter-spacing="1.4" font-family="ui-monospace,Menlo,monospace" fill="var(--mark)" font-weight="700">NOW</text>`;
  }

  const datumLine = D ? "" : `<line x1="${padL}" y1="${y(0).toFixed(1)}" x2="${W-padR}" y2="${y(0).toFixed(1)}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="1 4" opacity=".7"/>`;

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Tide curve">
    <defs>
      <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--shoal)" stop-opacity=".95"/>
        <stop offset="100%" stop-color="var(--shoal-deep)" stop-opacity=".55"/>
      </linearGradient>
      <pattern id="bed" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="var(--seabed-line)" stroke-width="1" opacity=".55"/>
      </pattern>
    </defs>
    ${bands}${grid}
    <path class="fadein" d="${fill}" fill="url(#wg)"/>
    <rect x="0" y="${H-bedH}" width="${W}" height="${bedH}" fill="var(--seabed)"/>
    <rect x="0" y="${H-bedH}" width="${W}" height="${bedH}" fill="url(#bed)"/>
    <line x1="0" y1="${H-bedH}" x2="${W}" y2="${H-bedH}" stroke="var(--seabed-line)" stroke-width="1"/>
    ${datumLine}
    <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    ${marks}${nowLayer}${labels}
  </svg>`;
}

/* ==================================================================
   Sewage map — a slippy chartlet stitched from OpenStreetMap tiles
   (no keys, no libraries). Drag to pan, pinch or scroll to zoom,
   tap an outfall for its card.
   ================================================================== */
const sewKey = it => it.company + "|" + (it.id || it.lat.toFixed(5) + "," + it.lon.toFixed(5));

function sewMercator(z){
  const s = 256 * Math.pow(2, z);
  return {
    s,
    x: lon => (lon + 180) / 360 * s,
    y: lat => { const k = Math.sin(clamp(lat, -85, 85) * Math.PI/180); return (0.5 - Math.log((1+k)/(1-k)) / (4*Math.PI)) * s; },
    lon: x => x / s * 360 - 180,
    lat: y => Math.atan(Math.sinh(Math.PI * (1 - 2*y/s))) * 180/Math.PI
  };
}

// One live view: centre, zoom and selection survive refreshes and re-renders,
// reset when the place or the search radius changes.
const sewMap = { pid:null, km:0, lat:0, lon:0, z:0, sel:null, off:0, el:null, place:null, items:[], bw:[], lg:[] };

function drawSewMap(el, place, items, km, off){
  if (sewMap.pid !== place.id || sewMap.km !== km){
    Object.assign(sewMap, { pid: place.id, km, sel: null, lat: place.lat, lon: place.lon, z: 0 });
  }
  const beach = data[place.id] && data[place.id].beach;
  Object.assign(sewMap, {
    el, place, items,
    bw: (beach && beach.bw) || [],
    lg: (beach && beach.lg) || [],
    off: off != null ? off : sewMap.off
  });
  if (!sewMap.z){
    const W = Math.max(el.clientWidth || 640, 280), H = W < 560 ? 240 : 320;
    const mpp0 = 156543.03392 * Math.cos(place.lat * Math.PI/180);
    sewMap.z = clamp(Math.floor(Math.log2(mpp0 * Math.min(W, H) / (2.4 * km * 1000))), 7, 17);
  }
  bindSewMap(el);
  renderSewMap();
}

function renderSewMap(){
  const { el, place, items, km } = sewMap;
  if (!el || !el.isConnected) return;
  const W = Math.max(el.clientWidth || 640, 280);
  const H = W < 560 ? 240 : 320;
  const M = sewMercator(sewMap.z), n = Math.pow(2, sewMap.z);
  const left = M.x(sewMap.lon) - W/2, top = M.y(sewMap.lat) - H/2;

  let tiles = "";
  const tx0 = Math.floor(left/256), tx1 = Math.floor((left + W)/256);
  const ty0 = Math.max(0, Math.floor(top/256)), ty1 = Math.min(n-1, Math.floor((top + H)/256));
  for (let tx = tx0; tx <= tx1; tx++){
    for (let ty = ty0; ty <= ty1; ty++){
      const wrapped = ((tx % n) + n) % n;
      // OSM first; if its volunteer servers decline, fall back to Carto's
      // light basemap (also keyless, every zoom), else leave the shoal blue.
      const carto = `https://basemaps.cartocdn.com/light_all/${sewMap.z}/${wrapped}/${ty}.png`;
      tiles += `<img src="https://tile.openstreetmap.org/${sewMap.z}/${wrapped}/${ty}.png" alt="" loading="lazy" decoding="async"
        style="left:${(tx*256 - left).toFixed(1)}px;top:${(ty*256 - top).toFixed(1)}px"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${carto}'}else{this.remove()}">`;
    }
  }

  // Radar overlay on its own (coarser) grid, stretched to the display zoom.
  let rain = "";
  const rf = state.rain && rainData && rainData.frames.length ? rainData.frames[rainData.idx] : null;
  if (rf){
    const rz = Math.min(sewMap.z, RAIN_MAX_Z);
    const rn = Math.pow(2, rz);
    const rt = 256 * Math.pow(2, sewMap.z - rz);   // screen px per radar tile
    const rx0 = Math.floor(left/rt), rx1 = Math.floor((left + W)/rt);
    const ry0 = Math.max(0, Math.floor(top/rt)), ry1 = Math.min(rn-1, Math.floor((top + H)/rt));
    for (let rx = rx0; rx <= rx1; rx++){
      for (let ry = ry0; ry <= ry1; ry++){
        const wrapped = ((rx % rn) + rn) % rn;
        rain += `<img class="rimg" data-t="${rz},${wrapped},${ry}" src="${rainTileUrl(rf, rz, wrapped, ry)}" alt="" loading="lazy" decoding="async"
          style="left:${(rx*rt - left).toFixed(1)}px;top:${(ry*rt - top).toFixed(1)}px;width:${rt}px;height:${rt}px" onerror="this.remove()">`;
      }
    }
  }

  const mpp = 156543.03392 * Math.cos(place.lat * Math.PI/180) / n;
  const ring = (km * 1000 / mpp).toFixed(1);
  const hx = (M.x(place.lon) - left).toFixed(1), hy = (M.y(place.lat) - top).toFixed(1);

  const now = Date.now();
  let marks = "";
  const halo = (X, Y) => `<circle cx="${X}" cy="${Y}" r="9.5" fill="none" stroke="var(--mark)" stroke-width="1.6"/>`;
  const hit = (X, Y) => `<circle cx="${X}" cy="${Y}" r="12" fill="transparent" stroke="none"/>`;

  // Beach layers underneath: bathing waters as classification diamonds,
  // lifeguarded beaches as pennants.
  if (state.beach){
    for (let i = 0; i < sewMap.bw.length; i++){
      const it = sewMap.bw[i];
      const X = +(M.x(it.lon) - left).toFixed(1), Y = +(M.y(it.lat) - top).toFixed(1);
      const pin = "bw:" + (it.ref || i);
      const c = bwColor(it.cls);
      marks += `<g data-pin="${esc(pin)}" tabindex="0" role="button" aria-label="${esc(it.name + " bathing water, " + (it.cls || "unclassified"))}">
        ${pin === sewMap.sel ? halo(X, Y) : ""}
        <path d="M${X} ${Y-5.4} L${X+5.4} ${Y} L${X} ${Y+5.4} L${X-5.4} ${Y} Z" fill="${c}" stroke="#fff" stroke-width="1.2"/>
        ${hit(X, Y)}<title>${esc(it.name + " — " + (it.cls ? it.cls + " (" + it.yr + ")" : "unclassified"))}</title></g>`;
    }
    for (let i = 0; i < sewMap.lg.length; i++){
      const it = sewMap.lg[i];
      const X = +(M.x(it.lon) - left).toFixed(1), Y = +(M.y(it.lat) - top).toFixed(1);
      const pin = "lg:" + i;
      marks += `<g data-pin="${esc(pin)}" tabindex="0" role="button" aria-label="${esc(it.name + ", RNLI lifeguarded beach")}">
        ${pin === sewMap.sel ? halo(X, Y + 3) : ""}
        <line x1="${X}" y1="${Y+5}" x2="${X}" y2="${Y-7}" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
        <line x1="${X}" y1="${Y+5}" x2="${X}" y2="${Y-7}" stroke="var(--ink)" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M${X} ${Y-7} l7 2.6 -7 2.6 Z" fill="#D9482B" stroke="#fff" stroke-width="0.9"/>
        ${hit(X, Y)}<title>${esc(it.name + " — RNLI lifeguarded beach")}</title></g>`;
    }
  }

  // Outfalls on top — idle first so anything discharging paints last.
  const order = { idle:0, offline:1, recent:2, active:3 };
  const sorted = items.map(it => ({ it, st: sewState(it, now) })).sort((a,b) => order[a.st] - order[b.st]);
  for (const { it, st } of sorted){
    const X = (M.x(it.lon) - left).toFixed(1), Y = (M.y(it.lat) - top).toFixed(1);
    const pin = "sew:" + sewKey(it);
    const what = st === "active" ? "discharging now" : st === "recent" ? "discharged in last 48 h"
               : st === "offline" ? "monitor offline" : "not discharging";
    const tip = `<title>${esc((titleCase(it.water) || it.id) + " · " + it.company + " — " + what)}</title>`;
    let dot;
    if (st === "active"){
      dot = `<circle class="pulse" cx="${X}" cy="${Y}" r="10" fill="var(--mark)" opacity=".25"/>
        <circle cx="${X}" cy="${Y}" r="4.4" fill="var(--mark)" stroke="#fff" stroke-width="1.4"/>`;
    } else if (st === "recent"){
      dot = `<circle cx="${X}" cy="${Y}" r="4" fill="var(--amber)" stroke="#fff" stroke-width="1.2"/>`;
    } else if (st === "offline"){
      dot = `<circle cx="${X}" cy="${Y}" r="3.2" fill="none" stroke="var(--ink-3)" stroke-width="1.3" stroke-dasharray="2 2"/>`;
    } else {
      dot = `<circle cx="${X}" cy="${Y}" r="3.2" fill="var(--panel)" stroke="var(--shoal-deep)" stroke-width="1.6"/>`;
    }
    marks += `<g data-pin="${esc(pin)}" tabindex="0" role="button" aria-label="${esc((titleCase(it.water) || it.id) + ", " + what)}">
      ${pin === sewMap.sel ? halo(X, Y) : ""}${dot}${hit(X, Y)}${tip}</g>`;
  }

  const layers = `<div class="slayers">
    <button data-lyr="rain" aria-pressed="${!!state.rain}">Rain</button>
    <button data-lyr="beach" aria-pressed="${!!state.beach}">Beaches</button>
    ${rf ? `<button data-rplay aria-label="${rainData.playing ? "Pause" : "Play"} the radar loop">${rainData.playing ? "❚❚" : "▶"}</button>
            <span class="rtime mono">${fmtT(rf.time * 1000, sewMap.off)}</span>` : ""}
  </div>`;

  el.style.height = H + "px";
  el.innerHTML = `<div class="smw">${tiles}${rain}
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-label="Beach and storm overflow map, ${km} km radius">
      <circle cx="${hx}" cy="${hy}" r="${ring}" fill="none" stroke="var(--mark)" stroke-width="1" stroke-dasharray="3 5" opacity=".55"/>
      <g stroke="#fff" stroke-width="3.6" stroke-linecap="round" opacity=".85"><line x1="${hx-7}" y1="${hy}" x2="${+hx+7}" y2="${hy}"/><line x1="${hx}" y1="${hy-7}" x2="${hx}" y2="${+hy+7}"/></g>
      <g stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"><line x1="${hx-7}" y1="${hy}" x2="${+hx+7}" y2="${hy}"/><line x1="${hx}" y1="${hy-7}" x2="${hx}" y2="${+hy+7}"/></g>
      ${marks}
    </svg></div>
    ${layers}
    <div class="szoom"><button data-sz="1" aria-label="Zoom in">+</button><button data-sz="-1" aria-label="Zoom out">−</button></div>
    ${pinCard(now)}
    <span class="osm">© OpenStreetMap · Carto</span>`;

  clearInterval(rainTimer);
  if (rf && rainData.playing) rainTimer = setInterval(rainTick, 700);
}

function pinCard(now){
  const sel = sewMap.sel;
  if (!sel) return "";
  if (sel.startsWith("sew:")){
    const it = sewMap.items.find(x => "sew:" + sewKey(x) === sel);
    return it ? sewCard(it, sewState(it, now), sewMap.off, now) : "";
  }
  if (sel.startsWith("bw:")){
    const key = sel.slice(3);
    const it = sewMap.bw.find((x, i) => (x.ref || String(i)) === key);
    if (!it) return "";
    const g = `https://maps.google.com/?q=${it.lat.toFixed(5)},${it.lon.toFixed(5)}`;
    return `<div class="scard" style="border-left-color:${bwColor(it.cls)}">
      <button class="x" data-sclose aria-label="Close">×</button>
      <span class="sw" style="background:${bwColor(it.cls)};color:#fff">${esc((it.cls || "N/A").toUpperCase())}</span> <b class="sea">${esc(it.name)}</b>
      <div class="meta">Designated bathing water · EA classification${it.yr ? " " + it.yr : ""}</div>
      <div class="meta2">${it.dist.toFixed(1)} km ${compass(it.brg)} of here</div>
      <div class="links"><a href="${g}" target="_blank" rel="noopener">Google Maps</a></div>
    </div>`;
  }
  if (sel.startsWith("lg:")){
    const it = sewMap.lg[Number(sel.slice(3))];
    if (!it) return "";
    const g = `https://maps.google.com/?q=${it.lat.toFixed(5)},${it.lon.toFixed(5)}`;
    return `<div class="scard" style="border-left-color:#D9482B">
      <button class="x" data-sclose aria-label="Close">×</button>
      <span class="sw" style="background:#D9482B;color:#fff">RNLI</span> <b class="sea">${esc(it.name)}</b>
      <div class="meta">Lifeguarded beach — check patrol season and flags on the day</div>
      <div class="meta2">${it.dist.toFixed(1)} km ${compass(it.brg)} of here</div>
      <div class="links">${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">RNLI page</a>` : ""}<a href="${g}" target="_blank" rel="noopener">Google Maps</a></div>
    </div>`;
  }
  return "";
}

function sewCard(it, st, off, now){
  const chip = { active:"DISCH", recent:"48 H", idle:"OK", offline:"OFF" }[st];
  const g = `https://maps.google.com/?q=${it.lat.toFixed(5)},${it.lon.toFixed(5)}`;
  const o = `https://www.openstreetmap.org/?mlat=${it.lat.toFixed(5)}&mlon=${it.lon.toFixed(5)}#map=16/${it.lat.toFixed(5)}/${it.lon.toFixed(5)}`;
  return `<div class="scard">
    <button class="x" data-sclose aria-label="Close">×</button>
    <span class="sw ${st}">${chip}</span> <b class="sea">${esc(titleCase(it.water) || it.id)}</b>
    <div class="meta">${esc(it.company)}${it.id ? " · " + esc(it.id) : ""}</div>
    <div class="meta2">${esc(sewNote(it, st, off, now))} · ${it.dist.toFixed(1)} km ${compass(it.brg)} of here</div>
    <div class="links"><a href="${g}" target="_blank" rel="noopener">Google Maps</a><a href="${o}" target="_blank" rel="noopener">OpenStreetMap</a></div>
  </div>`;
}

function sewZoomAt(dz, cx, cy){
  const el = sewMap.el;
  if (!el) return;
  const r = el.getBoundingClientRect();
  const px = cx != null ? cx - r.left : r.width/2;
  const py = cy != null ? cy - r.top : r.height/2;
  const z2 = clamp(sewMap.z + dz, 7, 17);
  if (z2 === sewMap.z) return;
  const M1 = sewMercator(sewMap.z);
  const lon = M1.lon(M1.x(sewMap.lon) - r.width/2 + px);
  const lat = M1.lat(M1.y(sewMap.lat) - r.height/2 + py);
  const M2 = sewMercator(z2);
  sewMap.lon = M2.lon(M2.x(lon) - (px - r.width/2));
  sewMap.lat = M2.lat(M2.y(lat) - (py - r.height/2));
  sewMap.z = z2;
  renderSewMap();
}

function bindSewMap(el){
  if (el.dataset.bound) return;
  el.dataset.bound = "1";

  // The zoom buttons and the card keep ordinary click behaviour; everything
  // else on the map is driven from pointer events below.
  el.addEventListener("click", e => {
    const zb = e.target.closest("[data-sz]");
    if (zb){ sewZoomAt(Number(zb.dataset.sz)); return; }
    if (e.target.closest("[data-sclose]")){ sewMap.sel = null; renderSewMap(); return; }
    const ly = e.target.closest("[data-lyr]");
    if (ly){
      if (ly.dataset.lyr === "rain"){ state.rain = !state.rain; if (state.rain) ensureRain(); }
      else { state.beach = !state.beach; if (state.beach && sewMap.place) ensureBeach(sewMap.place); }
      saveState(); renderSewMap(); return;
    }
    if (e.target.closest("[data-rplay]") && rainData){
      rainData.playing = !rainData.playing;
      renderSewMap();
    }
  });
  el.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest && e.target.closest("g[data-pin]");
    if (g){ e.preventDefault(); sewMap.sel = g.dataset.pin; renderSewMap(); }
  });
  el.addEventListener("wheel", e => {
    if (e.target.closest(".scard")) return;
    e.preventDefault();
    sewZoomAt(e.deltaY < 0 ? 1 : -1, e.clientX, e.clientY);
  }, { passive: false });
  el.addEventListener("dblclick", e => {
    if (e.target.closest(".szoom") || e.target.closest(".scard") || e.target.closest(".slayers")) return;
    e.preventDefault();
    sewZoomAt(1, e.clientX, e.clientY);
  });

  // Pan, pinch and tap. Pointers are captured immediately so a fast flick
  // that leaves the element before its first move event still pans, and no
  // stale pointer can wedge the gesture state; taps are resolved on
  // pointerup from the pointerdown target instead of the retargeted click.
  const ptrs = new Map();
  let anchor = null, downTarget = null, moved = false, pinch0 = 0, pinchMid = null, scale = 1;
  const wrap = () => el.querySelector(".smw");
  const pinchDist = () => {
    const [a, b] = [...ptrs.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };

  el.addEventListener("pointerdown", e => {
    if (e.target.closest(".szoom") || e.target.closest(".scard") || e.target.closest(".slayers")) return;
    try { el.setPointerCapture(e.pointerId); } catch {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1){
      anchor = { x: e.clientX, y: e.clientY };
      downTarget = e.target;
      moved = false;
    }
    if (ptrs.size === 2){
      pinch0 = pinchDist();
      const [a, b] = [...ptrs.values()];
      pinchMid = { x: (a.x + b.x)/2, y: (a.y + b.y)/2 };
      moved = true;
    }
  });
  el.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const w = wrap();
    if (!w) return;
    if (ptrs.size === 2 && pinch0 > 0){
      scale = clamp(pinchDist() / pinch0, .25, 4);
      const r = el.getBoundingClientRect();
      w.style.transformOrigin = (pinchMid.x - r.left) + "px " + (pinchMid.y - r.top) + "px";
      w.style.transform = "scale(" + scale + ")";
      return;
    }
    if (ptrs.size === 1 && anchor){
      const dx = e.clientX - anchor.x, dy = e.clientY - anchor.y;
      if (!moved && Math.hypot(dx, dy) > 4) moved = true;
      if (moved) w.style.transform = "translate(" + dx + "px," + dy + "px)";
    }
  });
  const finish = e => {
    if (!ptrs.has(e.pointerId)) return;
    const wasPinch = ptrs.size === 2 && pinch0 > 0;
    const last = ptrs.get(e.pointerId);
    ptrs.delete(e.pointerId);
    if (wasPinch){
      const dz = Math.round(Math.log2(scale));
      if (dz) sewZoomAt(dz, pinchMid.x, pinchMid.y); else renderSewMap();
      if (ptrs.size === 1){
        const [rem] = [...ptrs.values()];
        anchor = { x: rem.x, y: rem.y };
      }
      pinch0 = 0; pinchMid = null; scale = 1;
      return;
    }
    if (ptrs.size === 0){
      if (moved && anchor && e.type === "pointerup"){
        const dx = last.x - anchor.x, dy = last.y - anchor.y;
        const M = sewMercator(sewMap.z);
        sewMap.lon = M.lon(M.x(sewMap.lon) - dx);
        sewMap.lat = M.lat(M.y(sewMap.lat) - dy);
        renderSewMap();
      } else if (!moved && e.type === "pointerup" && downTarget){
        const g = downTarget.closest && downTarget.closest("g[data-pin]");
        if (g){ sewMap.sel = g.dataset.pin === sewMap.sel ? null : g.dataset.pin; renderSewMap(); }
      } else {
        const w = wrap();
        if (w) w.style.transform = "";
      }
      anchor = null; downTarget = null; moved = false; pinch0 = 0; pinchMid = null; scale = 1;
    }
  };
  el.addEventListener("pointerup", finish);
  el.addEventListener("pointercancel", finish);
}

function sewNote(it, st, off, now){
  if (st === "active"){
    const s = it.start || it.statusStart;
    return s ? "since " + fmtT(s, off) + " · " + dur(now - s) : "discharging";
  }
  if (st === "recent") return it.end ? "stopped " + dur(now - it.end) + " ago" : "in last 48 h";
  if (st === "offline") return "no signal";
  const e = it.end || it.statusStart;
  return e ? "quiet since " + fmtDM(e, off) : "no spill on record";
}

function sewRow(it, st, off, now){
  const chip = { active:"DISCH", recent:"48 H", idle:"OK", offline:"OFF" }[st];
  return `<div class="srow" data-sewrow="${esc(sewKey(it))}" title="Show on the map">
    <span class="sw ${st}">${chip}</span>
    <span class="who"><b class="sea">${esc(titleCase(it.water) || it.id)}</b>
      <span class="meta">${esc(it.company)}${it.id && it.water ? " · " + esc(it.id) : ""}</span></span>
    <span class="dist mono">${it.dist.toFixed(1)} km ${compass(it.brg)}</span>
    <span class="note">${esc(sewNote(it, st, off, now))}</span>
  </div>`;
}

function sewageSection(p, d, off){
  const s = d.sewage;
  const seg = `<span class="seg">` + SEW_RADII.map(k =>
    `<button data-sewkm="${k}" aria-pressed="${state.sewKm===k}">${k} km</button>`).join("") + `</span>`;
  const head = `<div class="shead"><span class="eyebrow">Beach watch · sewage · bathing water</span>${seg}</div>`;
  const open = `<section id="sec-sew" data-nav="Beach">`;

  if (!s || (!s.items && !s.error)){
    return `${open}${head}<div class="skel" style="height:180px"></div></section>`;
  }
  if (!s.items){
    return `${open}${head}<div class="notice" style="margin:0">
      <b>Couldn't reach the storm overflow feeds.</b><br>
      ${isBlocked(s.error) ? "This preview has no route out to the water companies' servers — open the page outside the preview and it will load." : esc(s.error || "")}
      <br><button class="hbtn" onclick="window.__retrySew()" style="margin-top:10px">Try again</button></div></section>`;
  }

  const now = Date.now();
  const withSt = s.items.map(it => ({ it, st: sewState(it, now) }));
  const act  = withSt.filter(x => x.st === "active");
  const rec  = withSt.filter(x => x.st === "recent");
  const idle = withSt.filter(x => x.st === "idle");
  const offl = withSt.filter(x => x.st === "offline");

  let big, desc, col = "var(--ink)";
  if (act.length){ big = act.length; desc = (act.length === 1 ? "outfall is" : "outfalls are") + " discharging into the sea near here right now"; col = "var(--mark)"; }
  else if (rec.length){ big = rec.length; desc = (rec.length === 1 ? "outfall" : "outfalls") + " discharged within the last 48 hours"; col = "var(--amber)"; }
  else if (withSt.length){ big = withSt.length; desc = "monitored outfalls — none discharging in the last 48 hours"; }

  const drop = `<svg class="wx" viewBox="0 0 26 29" aria-hidden="true" style="color:${col}">
    <path d="M13 3.5c3.4 4.8 5.6 7.7 5.6 10.6a5.6 5.6 0 1 1-11.2 0C7.4 11.2 9.6 8.3 13 3.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M4 25.5c2.3 0 2.3-2.4 4.5-2.4s2.3 2.4 4.5 2.4 2.3-2.4 4.5-2.4 2.3 2.4 4.5 2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></svg>`;

  let body;
  if (!withSt.length){
    body = `<div class="pane"><span class="eyebrow">Within ${s.radius} km</span>
      <div class="desc" style="font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.5">
        No monitored storm overflows within ${s.radius} km of this point. Coverage is the English water
        companies' event-duration monitors — try a wider radius, or a point nearer the English coast.</div></div>`;
  } else {
    // Nearest rated bathing water, for the "can the kids swim here" question.
    const bch = d.beach;
    let bwLine = "";
    if (state.beach && bch && bch.bw && bch.bw.length){
      const nb = bch.bw.find(x => x.cls) || bch.bw[0];
      const rated = bch.bw.filter(x => x.cls).length;
      bwLine = `<div class="srcnote">Nearest bathing water: <b style="color:${bwColor(nb.cls)}">${esc(nb.name)}</b> — ${esc(nb.cls || "unclassified")}${nb.yr ? " (" + nb.yr + ")" : ""} · ${nb.dist.toFixed(1)} km ${compass(nb.brg)}${rated > 1 ? ` · ${rated} rated beaches within ${s.radius} km` : ""}</div>`;
    }
    // Everything active or recent always shows; quiet outfalls fill up to twelve rows.
    const shown = [...act, ...rec, ...idle, ...offl].slice(0, Math.max(12, act.length + rec.length));
    const rest = withSt.length - shown.length;
    body = `<div class="pane" style="padding-bottom:13px">
      <div class="headline" style="margin-bottom:0">${drop}
        <div><div class="num" style="color:${col}">${big}</div><div class="desc">${desc}</div></div>
      </div>${bwLine}</div>
      <div class="sewmap" id="sewmap"></div>
      <div class="sewlist">${shown.map(x => sewRow(x.it, x.st, off, now)).join("")}
      ${rest > 0 ? `<div class="sewmore">…and ${rest} more monitored outfall${rest>1?"s":""} within ${s.radius} km, none discharging.</div>` : ""}</div>`;
  }

  const bch2 = d.beach;
  const hasBeach = state.beach && bch2 && ((bch2.bw && bch2.bw.length) || (bch2.lg && bch2.lg.length));
  const legend = `<div class="legend">
    <span><i class="dotl" style="background:var(--mark)"></i>Discharging</span>
    <span><i class="dotl" style="background:var(--amber)"></i>Last 48 h</span>
    <span><i class="dotl" style="background:var(--panel);border:1.5px solid var(--shoal-deep)"></i>Quiet</span>
    <span><i class="dotl" style="border:1px dashed var(--ink-3)"></i>Monitor offline</span>
    ${hasBeach ? `<span><i class="dotl" style="background:var(--good);border-radius:1px;transform:rotate(45deg)"></i>Bathing water (colour = rating)</span>
    <span><i class="dotl" style="background:#D9482B;border-radius:1px"></i>RNLI lifeguards</span>` : ""}
    ${withSt.length ? `<span>Tap a marker · drag to pan · pinch or scroll to zoom</span>` : ""}
    ${s.failed ? `<span>${s.failed} of ${SEWAGE_SOURCES.length} feeds unreachable</span>` : ""}
    <span style="margin-left:auto">checked ${fmtT(s.fetchedAt, off)}</span>
  </div>`;

  return `${open}${head}<div class="tidebox">${body}${legend}</div></section>`;
}

/* ==================================================================
   Render
   ================================================================== */
function activePlace(){ return state.places.find(p => p.id === state.activeId) || state.places[0]; }

function nightBands(weather){
  if (!weather || !weather.daily || !weather.daily.sunset) return [];
  const off = weather.utc_offset_seconds || 0, out = [];
  const { sunset, sunrise } = weather.daily;
  for (let i = 0; i < sunset.length - 1; i++){
    if (sunset[i] && sunrise[i+1]) out.push([epochOf(sunset[i],off), epochOf(sunrise[i+1],off)]);
  }
  return out;
}

function renderPlaces(){
  const el = $("#places");
  el.innerHTML = state.places.map(p => {
    const d = data[p.id];
    const tide = d && d.marine ? buildTide(d.marine) : null;
    let sub = "—";
    if (tide){
      const nx = tide.extrema.find(e => e.t > Date.now());
      if (nx) sub = (nx.type === "HW" ? "HW " : "LW ") + fmtT(nx.t, tide.off);
    } else if (d && d.error) sub = "no data";
    return `<button class="place" role="tab" data-id="${esc(p.id)}" aria-selected="${p.id===state.activeId}">
      <span class="nm">${esc(p.name)}</span><span class="sub mono">${esc(sub)}</span></button>`;
  }).join("") + `<button class="addbtn" id="openAdd" title="Add a place" aria-label="Add a place">+</button>`;

  el.querySelectorAll(".place").forEach(b => b.onclick = () => {
    state.activeId = b.dataset.id; saveState(); render();
  });
  $("#openAdd").onclick = () => openSheet("add");
}

function setUpdating(on){
  const u = $("#updated");
  if (on){ u.innerHTML = '<span class="dot"></span>Updating'; u.classList.remove("stale"); }
  else refreshStamp();
}
function refreshStamp(){
  const d = data[state.activeId];
  const u = $("#updated");
  if (!d || !d.fetchedAt){ u.textContent = ""; return; }
  const age = Date.now() - d.fetchedAt;
  const stale = age > REFRESH_MS * 1.5;
  u.classList.toggle("stale", stale);
  const dt = new Date(d.fetchedAt);
  u.innerHTML = '<span class="dot"></span>' + (age < 90000 ? "Live" : pad(dt.getHours()) + ":" + pad(dt.getMinutes()));
}

function isBlocked(msg){
  return /load failed|failed to fetch|networkerror|network request failed|refused to connect|content security policy/i.test(String(msg||""));
}

function blockedNotice(){
  return `<div class="notice" style="margin-top:22px">
    <b>This preview can't reach the forecast servers.</b><br>
    The frame it runs in only permits requests to a short list of hosts, and the weather and marine
    services aren't on it. Nothing is wrong with the page — it has no route out.
    <div style="margin-top:10px;line-height:1.6">
      Save this file and open it directly in a browser, or put it on any static host, and it will pull
      live data normally. Your places and settings save either way.
      If you're already running it outside this preview, check whether a VPN or content blocker is
      intercepting <span class="mono">open-meteo.com</span>.
    </div>
    <button class="hbtn" onclick="window.__retry()" style="margin-top:12px">Try again</button>
  </div>`;
}

function render(){
  renderPlaces();
  const p = activePlace();
  const main = $("#main");

  if (!p){
    main.innerHTML = `<div class="empty"><div class="eyebrow">No places</div>
      <p>Nothing to watch yet. Add a stretch of coast and the tide, the wind and the sea state come with it.</p>
      <button class="hbtn" id="emptyAdd">Add a place</button></div>`;
    $("#emptyAdd").onclick = () => openSheet("add");
    renderNav();
    return;
  }

  const d = data[p.id];
  if (!d || (!d.weather && !d.marine)){
    if (d && d.error){
      main.innerHTML = isBlocked(d.error)
        ? blockedNotice()
        : `<div class="notice" style="margin-top:22px"><b>Couldn't reach the forecast for ${esc(p.name)}.</b><br>${esc(d.error)}<br>
           <button class="hbtn" onclick="window.__retry()" style="margin-top:10px">Try again</button></div>`;
    } else {
      main.innerHTML = `<section style="border:0">
        <div class="skel" style="height:34px;width:220px;margin-bottom:18px"></div>
        <div class="skel" style="height:${window.innerWidth<560?200:260}px"></div></section>`;
    }
    renderNav();
    refreshStamp();
    return;
  }

  const w = d.weather, m = d.marine;
  const tide = m ? buildTide(m) : null;
  const off = (w && w.utc_offset_seconds) || (m && m.utc_offset_seconds) || 0;
  const tzab = (w && w.timezone_abbreviation) || "";
  const D = p.datum || 0;
  const now = Date.now();

  main.innerHTML =
    heroHtml(p, tide, off, tzab, D) +
    tideSection(tide) +
    conditionsSection(w, m, off, d.ukv) +
    sewageSection(p, d, off) +
    daysSection(w, m, tide, off) +
    synSection() +
    tableSection(tide, off, D) +
    (d.error === "partial" ? `<div class="notice"><b>Part of the forecast is missing.</b> Showing what came back. <button class="hbtn" onclick="window.__retry()">Try again</button></div>` : "") +
    footerHtml(m, tide);

  if (tide){
    const box = $("#tidebox");
    if (box) drawTide(box, tide, p, nightBands(w), state.window);
    document.querySelectorAll("[data-win]").forEach(b => b.onclick = () => {
      state.window = Number(b.dataset.win); saveState(); render();
    });
  }
  const smap = $("#sewmap");
  if (smap && d.sewage && d.sewage.items) drawSewMap(smap, p, d.sewage.items, d.sewage.radius || state.sewKm, off);
  document.querySelectorAll("[data-sewkm]").forEach(b => b.onclick = () => {
    state.sewKm = Number(b.dataset.sewkm); saveState();
    if (data[p.id]) delete data[p.id].sewage;
    render();
  });
  document.querySelectorAll("[data-sewrow]").forEach(r => r.onclick = () => {
    const s = data[p.id] && data[p.id].sewage;
    const it = s && s.items ? s.items.find(x => sewKey(x) === r.dataset.sewrow) : null;
    const el = $("#sewmap");
    if (!it || !el) return;
    sewMap.sel = "sew:" + sewKey(it);
    sewMap.lat = it.lat; sewMap.lon = it.lon;
    sewMap.z = Math.max(sewMap.z, 14);
    renderSewMap();
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  document.querySelectorAll("[data-syn]").forEach(b => b.onclick = () => {
    state.syn = b.dataset.syn; saveState(); render();
  });
  const syw = $("#synwrap"), syi = $("#synimg");
  if (syw && syi){
    // Wide forecast sheets: start scrolled to the eastern edge, where Britain is.
    const east = () => { syw.scrollLeft = syw.scrollWidth; };
    if (syi.complete) east(); else syi.onload = east;
    syi.onerror = () => { syw.innerHTML = `<div class="synerr">Chart unavailable just now — NOAA may be redrawing it. It refreshes several times a day.</div>`; };
  }
  ensureSewage(p);
  ensureBeach(p);
  if (state.rain) ensureRain();
  renderNav();
  refreshStamp();
  startTicker();
}

/* ==================================================================
   Section navigation — built from whatever sections rendered, with a
   scroll-spy underline so you always know where you are.
   ================================================================== */
let navSecs = [];
function renderNav(){
  const nav = $("#secnav");
  navSecs = [...document.querySelectorAll("#main section[data-nav]")];
  nav.innerHTML = navSecs.map(s => `<a href="#${s.id}">${esc(s.dataset.nav)}</a>`).join("");
  document.documentElement.style.setProperty("--headh", (document.querySelector("header").offsetHeight + 8) + "px");
  nav.querySelectorAll("a").forEach(a => a.onclick = e => {
    e.preventDefault();
    const t = document.querySelector(a.getAttribute("href"));
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  spyNav();
}
function spyNav(){
  if (!navSecs.length) return;
  const line = document.querySelector("header").offsetHeight + 40;
  let cur = navSecs[0];
  for (const s of navSecs) if (s.getBoundingClientRect().top <= line) cur = s;
  document.querySelectorAll("#secnav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === "#" + cur.id));
}
let spyRaf = 0;
window.addEventListener("scroll", () => {
  if (spyRaf) return;
  spyRaf = requestAnimationFrame(() => { spyRaf = 0; spyNav(); });
}, { passive: true });

function heroHtml(p, tide, off, tzab, D){
  let body = `<div class="state"><div class="big"><span class="lbl">No tide model here</span>
    <span class="count sea">—</span><span class="until">This grid cell has no sea level data. Try a point nearer open water.</span></div></div>`;

  if (tide){
    const now = Date.now();
    const nx = tide.extrema.find(e => e.t > now);
    const pv = [...tide.extrema].reverse().find(e => e.t <= now);
    const h = heightAt(tide, now) + D;
    if (nx){
      const mins = (nx.t - now) / 60000;
      const near = mins < 25;
      const label = near ? ("Near " + (nx.type === "HW" ? "high water" : "low water"))
                         : (nx.type === "HW" ? "Flooding" : "Ebbing");
      const rangeTxt = pv ? Math.abs(nx.h - pv.h).toFixed(1) + " m range" : "";
      body = `<div class="state">
        <div class="big">
          <span class="lbl">${label}</span>
          <span class="count sea">${dur(nx.t - now)}</span>
          <span class="until">to ${nx.type === "HW" ? "high" : "low"} water at <b class="mono">${fmtT(nx.t, off)}</b>${tzab ? " " + esc(tzab) : ""}</span>
        </div>
        <div class="hgt">
          <span class="eyebrow">Now</span>
          <span class="v sea">${h.toFixed(2)}<small> m ${D ? "above CD" : "rel. MSL"}</small></span>
          <span class="eyebrow" style="margin-top:5px">${esc(rangeTxt)}</span>
        </div>
      </div>`;
    }
  }

  return `<div class="hero">
    <div class="loc">
      <h1>${esc(p.name)}</h1>
      <span class="coords mono">${esc(p.region || "")}${p.region ? " · " : ""}${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}</span>
    </div>${body}</div>`;
}

function tideSection(tide){
  if (!tide) return "";
  return `<section id="sec-tide" data-nav="Tide">
    <div class="shead">
      <span class="eyebrow">Water over the ground</span>
      <span class="seg">
        <button data-win="24" aria-pressed="${state.window===24}">24h</button>
        <button data-win="48" aria-pressed="${state.window===48}">48h</button>
        <button data-win="96" aria-pressed="${state.window===96}">4 days</button>
      </span>
    </div>
    <div class="tidebox"><div id="tidebox"></div>
      <div class="legend">
        <span><i style="background:var(--ink)"></i>Sea surface</span>
        <span><i style="background:var(--shoal-deep)"></i>Water</span>
        <span><i style="background:var(--night-band);border:1px solid var(--rule)"></i>Darkness</span>
        <span><i style="background:var(--mark)"></i>Now</span>
        <span style="margin-left:auto">${(m2 => m2.name + " · " + m2.tides)(moonInfo(Date.now()))}</span>
      </div>
    </div>
  </section>`;
}

function num(v, dp, unit){
  return (v === null || v === undefined || !isFinite(v)) ? "—" : v.toFixed(dp) + (unit || "");
}

function conditionsSection(w, m, off, ukv){
  const c = (w && w.current) || {};
  const mc = (m && m.current) || {};
  const wi = wxInfo(c.weather_code, c.is_day !== 0);

  // Prefer the Met Office UKV 2 km wind where it exists — around headlands
  // and inside estuaries it is a different (and better) answer.
  const uc = (ukv && ukv.current) || {};
  const hires = uc.wind_speed_10m != null && uc.wind_direction_10m != null;
  const ws = hires ? uc.wind_speed_10m : c.wind_speed_10m;
  const wd = hires ? uc.wind_direction_10m : c.wind_direction_10m;
  const wg = hires && uc.wind_gusts_10m != null ? uc.wind_gusts_10m : c.wind_gusts_10m;

  const bf = beaufort(ws || 0);
  const waveH = mc.wave_height;
  const dg = (waveH !== undefined && waveH !== null) ? douglas(waveH) : null;
  const mph = ws !== undefined && ws !== null ? (ws * 1.15078) : null;
  const cur = mc.ocean_current_velocity !== undefined && mc.ocean_current_velocity !== null ? mc.ocean_current_velocity / 1.852 : null;

  // Barometric tendency over the last three hours, the old glass-tapping habit.
  let ptrend = "";
  if (w && w.hourly && w.hourly.pressure_msl){
    const pi = nearestIdx(w.hourly.time, off);
    if (pi >= 3 && isFinite(w.hourly.pressure_msl[pi]) && isFinite(w.hourly.pressure_msl[pi-3])){
      const dP = w.hourly.pressure_msl[pi] - w.hourly.pressure_msl[pi-3];
      const word = Math.abs(dP) < 1 ? "steady"
                 : (dP > 0 ? "rising" : "falling") + (Math.abs(dP) >= 3.5 ? " quickly" : "");
      ptrend = `<em>${word}${Math.abs(dP) >= 1 ? " " + Math.abs(dP).toFixed(1) + "/3h" : ""}</em>`;
    }
  }

  // Swell from the hourly series at the nearest hour.
  let sw = {};
  const mi = m && m.hourly ? nearestIdx(m.hourly.time, m.utc_offset_seconds || 0) : -1;
  if (mi >= 0){
    const H = m.hourly;
    sw = {
      h: H.swell_wave_height ? H.swell_wave_height[mi] : null,
      p: H.swell_wave_period ? H.swell_wave_period[mi] : null,
      d: H.swell_wave_direction ? H.swell_wave_direction[mi] : null,
      wind: H.wind_wave_height ? H.wind_wave_height[mi] : null
    };
  }

  // Visibility only comes hourly.
  let vis = null;
  const wi2 = w && w.hourly ? nearestIdx(w.hourly.time, off) : -1;
  if (wi2 >= 0 && w.hourly.visibility) vis = w.hourly.visibility[wi2];

  let sunTxt = "—";
  if (w && w.daily && w.daily.sunrise){
    const k = dayKey(Date.now(), off);
    let i = w.daily.time.indexOf(k);
    if (i < 0) i = Math.min(1, w.daily.sunrise.length - 1);
    if (w.daily.sunrise[i] && w.daily.sunset[i]){
      sunTxt = fmtT(epochOf(w.daily.sunrise[i], off), off) + " · " + fmtT(epochOf(w.daily.sunset[i], off), off);
    }
  }

  // Tidal stream through the next sixteen hours, every two hours — the SMOC
  // model behind it carries the tide, so the arrows swing with the flood and ebb.
  let stream = "";
  if (m && m.hourly && m.hourly.ocean_current_velocity && m.hourly.ocean_current_direction){
    const H = m.hourly, moff = m.utc_offset_seconds || 0;
    const i0 = nearestIdx(H.time, moff);
    if (i0 >= 0){
      let cells = "";
      for (let k2 = 0; k2 < 8; k2++){
        const i = i0 + k2*2;
        if (i >= H.time.length) break;
        const v = H.ocean_current_velocity[i], dd = H.ocean_current_direction[i];
        if (v == null || dd == null) continue;
        cells += `<div class="tsc"><span class="th mono">${fmtT(epochOf(H.time[i], moff), moff)}</span>${arrowSvg((dd+180)%360)}<span class="tv mono">${(v/1.852).toFixed(1)}</span></div>`;
      }
      if (cells) stream = `<div class="tstrip"><span class="eyebrow">Tidal stream · kn · arrows fly with the set</span>${cells}</div>`;
    }
  }

  return `<section id="sec-now" data-nav="Now"><div class="two">
    <div class="pane">
      <span class="eyebrow">Ashore</span>
      <div class="headline">
        ${wxSvg(wi.icon, "wx")}
        <div>
          <div class="num">${num(c.temperature_2m, 0, "°")}<small> C</small></div>
          <div class="desc">${esc(wi.text)} · feels ${num(c.apparent_temperature, 0, "°")}</div>
        </div>
      </div>
      <div class="rows">
        <div class="row"><span class="k">Wind</span><span class="v">${arrowSvg(wd || 0)}<span class="mono">${num(ws,0)} kn</span> <em>${compass(wd||0)} · F${bf.f} ${esc(bf.name)}</em></span></div>
        <div class="row"><span class="k">Gusts</span><span class="v mono">${num(wg,0)} kn<em>${num(mph,0)} mph mean</em></span></div>
        <div class="row"><span class="k">Pressure</span><span class="v mono">${num(c.pressure_msl,0)} hPa${ptrend}</span></div>
        <div class="row"><span class="k">Cloud · Humidity</span><span class="v mono">${num(c.cloud_cover,0)}% · ${num(c.relative_humidity_2m,0)}%</span></div>
        <div class="row"><span class="k">Rain now</span><span class="v mono">${num(c.precipitation,1)} mm</span></div>
        <div class="row"><span class="k">UV index</span><span class="v mono">${num(c.uv_index,1)}<em>${uvWord(c.uv_index)}</em></span></div>
        <div class="row"><span class="k">Sun</span><span class="v mono">${esc(sunTxt)}</span></div>
      </div>
      ${hires ? `<div class="srcnote">Wind from the Met Office UKV model on its 2 km grid — fine enough to see round headlands. The rest is the blended forecast.</div>` : ""}
    </div>
    <div class="pane">
      <span class="eyebrow">Afloat</span>
      <div class="headline">
        <svg class="wx" viewBox="0 0 26 29" aria-hidden="true">
          <path d="M1 17c2.6 0 2.6-4 5.2-4s2.6 4 5.2 4 2.6-4 5.2-4 2.6 4 5.2 4 2.6-4 3.2-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M1 24c2.6 0 2.6-4 5.2-4s2.6 4 5.2 4 2.6-4 5.2-4 2.6 4 5.2 4 2.6-4 3.2-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
        </svg>
        <div>
          <div class="num sea">${num(waveH, 1)}<small> m</small></div>
          <div class="desc">${dg ? esc(dg.name) + " · Douglas " + dg.d : "No wave data"}</div>
        </div>
      </div>
      <div class="rows">
        <div class="row"><span class="k">Sea temp</span><span class="v sea mono">${num(mc.sea_surface_temperature,1,"°C")}</span></div>
        <div class="row"><span class="k">Wave period</span><span class="v mono">${num(mc.wave_period,0)} s<em>from ${compass(mc.wave_direction||0)}</em></span></div>
        <div class="row"><span class="k">Swell</span><span class="v mono">${num(sw.h,1)} m · ${num(sw.p,0)} s<em>${sw.d != null ? compass(sw.d) : "—"}</em></span></div>
        <div class="row"><span class="k">Wind wave</span><span class="v mono">${num(sw.wind,1)} m</span></div>
        <div class="row"><span class="k">Current</span><span class="v">${mc.ocean_current_direction != null ? arrowSvg((mc.ocean_current_direction+180)%360) : ""}<span class="mono">${num(cur,1)} kn</span> <em>${mc.ocean_current_direction != null ? "setting " + compass(mc.ocean_current_direction) : ""}</em></span></div>
        <div class="row"><span class="k">Visibility</span><span class="v mono">${vis != null ? (vis/1000).toFixed(1) + " km" : "—"}</span></div>
      </div>
      ${stream}
    </div>
  </div></section>`;
}

function synSection(){
  const cur = SYN_CHARTS.find(x => x.k === state.syn) || SYN_CHARTS[0];
  return `<section id="sec-syn" data-nav="Synoptic">
    <div class="shead"><span class="eyebrow">Synoptic · fronts &amp; isobars</span>
      <span class="seg">${SYN_CHARTS.map(x =>
        `<button data-syn="${x.k}" aria-pressed="${x.k === cur.k}">${x.label}</button>`).join("")}</span>
    </div>
    <div class="tidebox">
      <div class="synwrap" id="synwrap">
        <a href="${cur.url}" target="_blank" rel="noopener" title="Open the full-size chart">
          <img id="synimg" src="${cur.url}" alt="North Atlantic surface ${cur.k === "now" ? "analysis" : "forecast"} chart with fronts and isobars" loading="lazy" decoding="async"></a>
      </div>
      <div class="legend">
        <span>NOAA Ocean Prediction Center surface ${cur.k === "now" ? "analysis" : "forecast"} · North Atlantic${cur.k === "now" ? "" : " — the British Isles sit at the right-hand edge"}</span>
        <span style="margin-left:auto">tap the chart for full size</span>
      </div>
    </div>
  </section>`;
}

function daysSection(w, m, tide, off){
  if (!w || !w.daily || !w.daily.time) return "";
  const dl = w.daily, ml = (m && m.daily) || {};
  const todayKey = dayKey(Date.now(), off);
  let cells = "";
  for (let i = 0; i < dl.time.length; i++){
    const ep = epochOf(dl.time[i] + "T12:00", off);
    const k = dl.time[i];
    if (k < todayKey) continue;                       // hide yesterday
    const isToday = k === todayKey;
    const wi = wxInfo(dl.weather_code[i], true);
    const wave = ml.wave_height_max ? ml.wave_height_max[i] : null;
    cells += `<div class="day${isToday ? " today" : ""}">
      <span class="dn">${isToday ? "Today" : fmtD(ep, off)}</span>
      ${wxSvg(wi.icon, "wx")}
      <span class="tmp mono">${num(dl.temperature_2m_max[i],0,"°")} <span>${num(dl.temperature_2m_min[i],0,"°")}</span></span>
      <span class="mini mono">${arrowSvg(dl.wind_direction_10m_dominant[i]||0)}${num(dl.wind_speed_10m_max[i],0)}–${num(dl.wind_gusts_10m_max[i],0)} kn</span>
      <span class="mini sea">${wave != null ? "sea " + num(wave,1) + " m" : ""}</span>
      <span class="mini mono">${num(dl.precipitation_probability_max ? dl.precipitation_probability_max[i] : null,0)}% rain · UV ${num(dl.uv_index_max ? dl.uv_index_max[i] : null,0)}</span>
    </div>`;
  }
  return `<section id="sec-week" data-nav="Week"><div class="shead"><span class="eyebrow">Week ahead</span></div>
    <div class="days">${cells}</div></section>`;
}

function tableSection(tide, off, D){
  if (!tide) return "";
  const now = Date.now();
  const byDay = new Map();
  for (const e of tide.extrema){
    if (e.t < now - 6*3600000) continue;
    const k = dayKey(e.t, off);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(e);
  }
  const todayKey = dayKey(now, off);
  let rows = "";
  for (const [k, evs] of byDay){
    const isToday = k === todayKey;
    rows += `<div class="ttday${isToday ? " today" : ""}">
      <div class="ttd">${isToday ? "Today" : fmtD(evs[0].t, off)}</div>
      <div class="ttev">${evs.map(e => `<span class="ev ${e.type.toLowerCase()}">
        <span class="m">${e.type}</span>
        <span class="t mono">${fmtT(e.t, off)}</span>
        <span class="h sea">${(e.h + D).toFixed(2)} m</span></span>`).join("")}</div>
    </div>`;
  }
  return `<section id="sec-tt" data-nav="HW·LW"><div class="shead"><span class="eyebrow">High and low water</span>
    <span class="eyebrow">${D ? "above chart datum" : "relative to mean sea level"}</span></div>
    <div class="tt">${rows}</div></section>`;
}

function footerHtml(m, tide){
  return `<footer>
    Weather from national meteorological services via Open-Meteo, with wind over the British Isles from the Met Office UKV model on its 2 km grid.
    Waves, sea temperature, currents and sea level from Copernicus Marine (MeteoFrance SMOC and MFWAM) via Open-Meteo — the tidal stream arrows carry the tide but not local eddies.
    Synoptic charts by the NOAA Ocean Prediction Center. Rain radar by RainViewer.
    Storm overflow status straight from the water companies' event-duration monitors via the Stream open data platform (the National Storm Overflow Hub, England only; refreshed every ten minutes,
    and a monitor saying nothing is not the same as nothing happening).
    Bathing water classifications from the Environment Agency (England, Open Government Licence); lifeguarded beaches from RNLI open data — patrols are seasonal, so check flags on the day.
    Map tiles © OpenStreetMap contributors.<br>
    Sea level is modelled on an 8 km grid and referenced to mean sea level, not chart datum. In a place as awkward as the Solent it will read a few minutes and a few tenths out.
    <b style="color:var(--ink-2)">Not for navigation — keep the almanac.</b>
  </footer>`;
}

/* ==================================================================
   Live countdown
   ================================================================== */
function startTicker(){
  clearInterval(ticker);
  ticker = setInterval(() => {
    const p = activePlace(); if (!p) return;
    const d = data[p.id]; if (!d || !d.marine) return;
    const tide = buildTide(d.marine); if (!tide) return;
    const nx = tide.extrema.find(e => e.t > Date.now());
    const el = document.querySelector(".state .count");
    if (nx && el) el.textContent = dur(nx.t - Date.now());
    refreshStamp();
  }, 15000);
}

/* ==================================================================
   Sheet: add and manage places
   ================================================================== */
function openSheet(tab){
  $("#scrim").classList.add("open");
  $("#sheet").classList.add("open");
  switchTab(tab || "add");
  if (tab !== "manage") setTimeout(() => $("#q").focus(), 60);
}
function closeSheet(){
  $("#scrim").classList.remove("open");
  $("#sheet").classList.remove("open");
}
function switchTab(t){
  const add = t === "add";
  $("#tabAdd").setAttribute("aria-selected", add);
  $("#tabManage").setAttribute("aria-selected", !add);
  $("#panelAdd").hidden = !add;
  $("#panelManage").hidden = add;
  if (!add) renderManage();
}

function renderQuick(){
  $("#quick").innerHTML = QUICK.map((q,i) =>
    `<button class="chip" data-q="${i}">${esc(q.name)}</button>`).join("");
  $("#quick").querySelectorAll("[data-q]").forEach(b =>
    b.onclick = () => addPlace(QUICK[Number(b.dataset.q)]));
}

function renderManage(){
  const el = $("#panelManage");
  if (!state.places.length){ el.innerHTML = `<p style="color:var(--ink-3);font-size:13px">No places yet.</p>`; return; }
  el.innerHTML = state.places.map(p => `<div class="mrow">
      <div class="info"><b>${esc(p.name)}</b><span class="mono">${p.lat.toFixed(3)}, ${p.lon.toFixed(3)}${p.region ? " · " + esc(p.region) : ""}</span></div>
      <input type="number" step="0.1" value="${p.datum || 0}" data-datum="${esc(p.id)}" aria-label="Chart datum offset for ${esc(p.name)}" title="Chart datum offset in metres">
      <button class="rm" data-rm="${esc(p.id)}">Remove</button>
    </div>`).join("") +
    `<div class="hint" style="font-size:11.5px;color:var(--ink-3);margin-top:14px;line-height:1.55">
      <b style="color:var(--ink-2)">Chart datum offset.</b> Modelled heights sit around mean sea level, so they run negative at low water.
      Enter the height of mean sea level above chart datum for the nearest standard port and the numbers read like an almanac.
      Portsmouth is about 2.7 m, Southampton about 2.9 m, Poole about 1.2 m.
    </div>`;

  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => removePlace(b.dataset.rm));
  el.querySelectorAll("[data-datum]").forEach(inp => inp.onchange = () => {
    const p = state.places.find(x => x.id === inp.dataset.datum);
    if (p){ p.datum = Number(inp.value) || 0; saveState(); render(); }
  });
}

function slugify(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || ("p" + Date.now());
}

async function addPlace(loc){
  if (state.places.length >= 8){
    alert("Eight places is the limit — remove one first.");
    return;
  }
  let id = slugify(loc.name);
  while (state.places.some(p => p.id === id)) id += "-2";
  const p = { id, name: loc.name, region: loc.region || "", lat: +(+loc.lat).toFixed(4), lon: +(+loc.lon).toFixed(4), datum: 0 };
  state.places.push(p);
  state.activeId = id;
  await saveState();
  closeSheet();
  render();
  await loadPlace(p);
  await Store.set(K_CACHE, data);
  render();
}

async function removePlace(id){
  state.places = state.places.filter(p => p.id !== id);
  delete data[id];
  if (state.activeId === id) state.activeId = state.places.length ? state.places[0].id : null;
  await saveState();
  await Store.set(K_CACHE, data);
  renderManage();
  render();
}

let searchSeq = 0;
async function search(q){
  const box = $("#results");
  const seq = ++searchSeq;   // a slow earlier response must not clobber a newer one
  q = q.trim();
  if (q.length < 2){ box.innerHTML = ""; return; }

  const coord = q.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if (coord){
    const lat = +coord[1], lon = +coord[2];
    box.innerHTML = `<ul class="res"><li><button data-lat="${lat}" data-lon="${lon}" data-name="${lat.toFixed(3)}, ${lon.toFixed(3)}" data-region="Custom point">
      <span>${lat.toFixed(3)}, ${lon.toFixed(3)}</span><span class="meta">Use these coordinates</span></button></li></ul>`;
    bindResults(box);
    return;
  }

  box.innerHTML = `<div class="skel" style="height:44px"></div>`;
  try {
    const j = await jget("https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&format=json&name=" + encodeURIComponent(q));
    if (seq !== searchSeq) return;
    const rs = (j && j.results) || [];
    if (!rs.length){ box.innerHTML = `<p style="font-size:13px;color:var(--ink-3);padding:6px 0">Nothing found. Try a nearby town, or paste coordinates as <span class="mono">50.718 -1.106</span>.</p>`; return; }
    box.innerHTML = `<ul class="res">` + rs.map(r => {
      const region = [r.admin1, r.country].filter(Boolean).join(", ");
      return `<li><button data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${esc(r.name)}" data-region="${esc(region)}">
        <span>${esc(r.name)}</span><span class="meta">${esc(region)}</span></button></li>`;
    }).join("") + `</ul>`;
    bindResults(box);
  } catch (e){
    if (seq !== searchSeq) return;
    box.innerHTML = isBlocked(e && e.message)
      ? `<p style="font-size:13px;color:var(--ink-3);padding:6px 0;line-height:1.6">Search needs network access this preview doesn't have. Paste coordinates instead — <span class="mono">50.718 -1.106</span> — which works offline.</p>`
      : `<p style="font-size:13px;color:var(--ink-3);padding:6px 0">Search is unreachable. Paste coordinates instead, like <span class="mono">50.718 -1.106</span>.</p>`;
  }
}
function bindResults(box){
  box.querySelectorAll("button[data-lat]").forEach(b => b.onclick = () => {
    addPlace({ name: b.dataset.name, region: b.dataset.region, lat: b.dataset.lat, lon: b.dataset.lon });
    $("#q").value = ""; box.innerHTML = "";
  });
}

/* ==================================================================
   Boot
   ================================================================== */
async function saveState(){ await Store.set(K_STATE, state); }

function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);
  $("#themeBtn").title = state.theme === "night" ? "Switch to chart mode" : "Switch to night mode";
  // Keep the browser chrome in step with the chosen theme, not the OS one.
  const tc = state.theme === "night" ? "#06131A" : "#F3F5F0";
  document.querySelectorAll('meta[name="theme-color"]').forEach(m2 => m2.content = tc);
}

window.__retry = () => loadAll();
window.__retrySew = () => {
  const d = data[state.activeId];
  if (d) delete d.sewage;
  render();
};

async function boot(){
  const saved = await Store.get(K_STATE);
  if (saved && Array.isArray(saved.places)) state = Object.assign(state, saved);
  if (!state.places.length) state.places = SEED.slice();
  if (!state.places.some(p => p.id === state.activeId)) state.activeId = state.places[0].id;
  applyTheme();

  const cached = await Store.get(K_CACHE);
  if (cached && typeof cached === "object") data = cached;
  render();

  await loadAll();
}

$("#themeBtn").onclick = () => { state.theme = state.theme === "night" ? "chart" : "night"; applyTheme(); saveState(); render(); };
$("#refreshBtn").onclick = () => loadAll();
$("#closeSheet").onclick = closeSheet;
$("#scrim").onclick = closeSheet;
$("#tabAdd").onclick = () => switchTab("add");
$("#tabManage").onclick = () => switchTab("manage");
$("#q").oninput = e => { clearTimeout(searchTimer); const v = e.target.value; searchTimer = setTimeout(() => search(v), 320); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const p = activePlace(), d = p && data[p.id], box = $("#tidebox");
    if (box && d && d.marine){
      const tide = buildTide(d.marine);
      if (tide) drawTide(box, tide, p, nightBands(d.weather), state.window);
    }
    const smap = $("#sewmap");
    if (smap && d && d.sewage && d.sewage.items) drawSewMap(smap, p, d.sewage.items, d.sewage.radius || state.sewKm);
  }, 180);
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const d = data[state.activeId];
  if (!d || Date.now() - (d.fetchedAt || 0) > REFRESH_MS) loadAll();
});

setInterval(() => { if (document.visibilityState === "visible") loadAll(); }, REFRESH_MS);

renderQuick();
boot();
</script>
</body>
</html>
