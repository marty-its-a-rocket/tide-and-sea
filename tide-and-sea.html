<!DOCTYPE html>
<html lang="en-GB" data-theme="chart">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tide">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06131A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F3F5F0'/%3E%3Cpath d='M3 20c2.2 0 2.2-5 4.3-5s2.2 5 4.3 5 2.2-5 4.3-5 2.2 5 4.3 5 2.2-5 4.3-5 2.2 5 2.5 5' stroke='%23C10070' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Tide &amp; Sea</title>
<style>
/* ------------------------------------------------------------------
   Palette drawn from Admiralty chart conventions:
   chart white paper, shoal blue, drying green, and the magenta
   overprint used for anything the mariner must not miss.
   ------------------------------------------------------------------ */
:root[data-theme="chart"]{
  --paper:#F3F5F0;
  --panel:#FBFCF9;
  --ink:#0E2029;
  --ink-2:#4B646F;
  --ink-3:#8299A3;
  --rule:#D6DED8;
  --rule-soft:#E6EBE5;
  --shoal:#BEDAE9;
  --shoal-deep:#8FBFD8;
  --drying:#CFE2C2;
  --seabed:#DED6C0;
  --seabed-line:#B9AD8E;
  --mark:#C10070;
  --mark-soft:rgba(193,0,112,.12);
  --amber:#A87900;
  --good:#177A50;
  --night-band:rgba(14,32,41,.055);
  --shadow:0 1px 0 rgba(14,32,41,.05);
}
:root[data-theme="night"]{
  --paper:#06131A;
  --panel:#0A1D26;
  --ink:#DCE9EE;
  --ink-2:#8AA5B0;
  --ink-3:#5D7681;
  --rule:#16323F;
  --rule-soft:#102630;
  --shoal:#123C53;
  --shoal-deep:#1B5875;
  --drying:#173F2E;
  --seabed:#17232A;
  --seabed-line:#2C3F49;
  --mark:#FF4FAC;
  --mark-soft:rgba(255,79,172,.16);
  --amber:#E0B54A;
  --good:#3CC28F;
  --night-band:rgba(255,255,255,.035);
  --shadow:none;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper);min-height:100%}
body{
  background:var(--paper);
  min-height:100vh;
  color:var(--ink);
  font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}

/* Chart convention: water features are set in italic serif, land upright. */
.sea{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-style:italic}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{
  font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

body::before{content:"";position:fixed;inset:0;background:var(--paper);z-index:-1}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top);
}
.hbar{display:flex;align-items:center;gap:12px;height:52px}
.brand{display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
.brand b{font-size:13px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}
.hspace{flex:1}
.hbtn{
  appearance:none;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);
  height:30px;min-width:30px;padding:0 9px;border-radius:2px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
}
.hbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.hbtn svg{width:14px;height:14px}
.updated{font-size:11px;color:var(--ink-3);white-space:nowrap}
.updated .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mark);margin-right:5px;vertical-align:1px}
.updated.stale .dot{background:var(--ink-3)}

/* ---------- place tabs ---------- */
.places{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--rule-soft)}
.places::-webkit-scrollbar{display:none}
.place{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 14px 8px;cursor:pointer;text-align:left;white-space:nowrap;color:var(--ink-2);
  display:flex;flex-direction:column;gap:1px;flex:0 0 auto;
}
.place:first-child{padding-left:0}
.place .nm{font-size:13px;font-weight:600;letter-spacing:.01em}
.place .sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.place[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}
.place[aria-selected="true"] .sub{color:var(--mark)}
.addbtn{
  flex:0 0 auto;align-self:center;margin-left:8px;background:none;border:1px dashed var(--rule);
  color:var(--ink-3);border-radius:2px;width:26px;height:26px;font-size:16px;line-height:1;cursor:pointer;
}
.addbtn:hover{color:var(--mark);border-color:var(--mark)}

/* ---------- hero ---------- */
.hero{padding:26px 0 20px;border-bottom:1px solid var(--rule-soft)}
.hero .loc{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.hero h1{font-size:15px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.hero .coords{font-size:11px;color:var(--ink-3)}
.state{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.state .big{display:flex;flex-direction:column}
.state .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mark);font-weight:650;margin-bottom:2px}
.state .count{font-size:clamp(38px,11vw,60px);line-height:.95;letter-spacing:-.025em;font-weight:400}
.state .until{font-size:13px;color:var(--ink-2);margin-top:7px}
.state .until b{font-weight:600;color:var(--ink)}
.hgt{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.hgt .v{font-size:26px;line-height:1}
.hgt .v small{font-size:13px;color:var(--ink-2);font-style:normal;font-family:inherit}

/* ---------- section nav ---------- */
.secnav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--rule-soft)}
.secnav::-webkit-scrollbar{display:none}
.secnav:empty{display:none}
.secnav a{
  padding:7px 12px 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:650;
  color:var(--ink-3);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
.secnav a:first-child{padding-left:0}
.secnav a:hover{color:var(--ink)}
.secnav a.on{color:var(--mark);border-bottom-color:var(--mark)}

/* ---------- sections ---------- */
section{padding:22px 0;border-bottom:1px solid var(--rule-soft);scroll-margin-top:var(--headh,124px)}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{
  appearance:none;background:var(--panel);border:0;border-left:1px solid var(--rule);
  padding:4px 10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  color:var(--ink-3);cursor:pointer;font-family:ui-monospace,Menlo,monospace;
}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--mark);color:#fff;border-color:var(--mark)}

/* ---------- tide section ---------- */
.tidebox{border:1px solid var(--rule);background:var(--panel);border-radius:3px;overflow:hidden;box-shadow:var(--shadow)}
.tidebox svg{display:block;width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:9px 12px;border-top:1px solid var(--rule-soft);font-size:10.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;display:inline-block;border-radius:2px}

/* ---------- now grid ---------- */
.two{display:grid;grid-template-columns:1fr;gap:1px;background:var(--rule-soft);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
@media(min-width:720px){.two{grid-template-columns:1fr 1fr}}
.pane{background:var(--panel);padding:16px 16px 18px}
.pane > .eyebrow{display:block;margin-bottom:12px}
.headline{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.headline .num{font-size:34px;line-height:1;letter-spacing:-.02em}
.headline .num small{font-size:15px;color:var(--ink-2)}
.headline .desc{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.headline svg.wx{width:34px;height:34px;flex:0 0 auto}
.rows{display:grid;grid-template-columns:1fr;gap:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--rule-soft);font-size:13px}
.row:first-child{border-top:0}
.row .k{color:var(--ink-3);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}
.row .v{text-align:right;white-space:nowrap}
.row .v em{font-style:normal;color:var(--ink-3);font-size:11.5px;margin-left:5px}
.arrow{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:5px;color:var(--ink-2)}

/* ---------- days ---------- */
.days{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border:1px solid var(--rule);border-radius:3px;background:var(--panel)}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 108px;padding:13px 11px 14px;border-left:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.day:first-child{border-left:0}
.day .dn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:650;color:var(--ink-2);font-family:ui-monospace,Menlo,monospace}
.day.today .dn{color:var(--mark)}
.day svg.wx{width:26px;height:26px}
.day .tmp{font-size:15px}
.day .tmp span{color:var(--ink-3)}
.day .mini{font-size:11px;color:var(--ink-3);line-height:1.5}

/* ---------- tide table ---------- */
.tt{border:1px solid var(--rule);border-radius:3px;background:var(--panel);overflow:hidden}
.ttday{display:grid;grid-template-columns:76px 1fr;border-top:1px solid var(--rule-soft)}
.ttday:first-child{border-top:0}
.ttday.today{background:var(--mark-soft)}
.ttd{padding:11px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;border-right:1px solid var(--rule-soft)}
.ttday.today .ttd{color:var(--mark);font-weight:650}
.ttev{display:flex;flex-wrap:wrap;gap:0 20px;padding:11px 12px}
.ev{display:flex;align-items:baseline;gap:7px;padding:2px 0;min-width:118px}
.ev .t{font-size:14px}
.ev .h{font-size:12px;color:var(--ink-2)}
.ev .m{font-size:9.5px;letter-spacing:.12em;font-weight:700;font-family:ui-monospace,Menlo,monospace;padding:1px 4px;border-radius:2px}
.ev.hw .m{background:var(--shoal-deep);color:var(--panel)}
.ev.lw .m{background:var(--drying);color:var(--ink)}
:root[data-theme="night"] .ev.hw .m{color:#04121A}
:root[data-theme="night"] .ev.lw .m{color:#CFE2C2}

/* ---------- sewage watch ---------- */
.sewmap{position:relative;overflow:hidden;background:var(--shoal);border-top:1px solid var(--rule-soft);touch-action:none;user-select:none;-webkit-user-select:none}
.sewmap img{position:absolute;width:256px;height:256px;max-width:none;filter:saturate(.4) contrast(.95);pointer-events:none}
:root[data-theme="night"] .sewmap img{filter:invert(1) hue-rotate(180deg) saturate(.3) brightness(.85) contrast(.92)}
.sewmap img.rimg{opacity:.62;filter:none}
:root[data-theme="night"] .sewmap img.rimg{filter:none;opacity:.55}
.slayers{position:absolute;top:8px;left:8px;display:flex;gap:6px;align-items:center}
.slayers button{
  appearance:none;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);
  height:26px;padding:0 9px;border-radius:2px;cursor:pointer;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:650;font-family:ui-monospace,Menlo,monospace;box-shadow:var(--shadow);
}
.slayers button:hover{color:var(--mark)}
.slayers button[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#fff}
.slayers .rtime{
  font-size:10px;background:var(--panel);border:1px solid var(--rule);border-radius:2px;
  height:26px;display:inline-flex;align-items:center;padding:0 8px;color:var(--ink-2);
}
.sewmap svg{display:block;position:absolute;inset:0}
.smw{position:absolute;inset:0;cursor:grab}
.smw:active{cursor:grabbing}
.sewmap g[data-sew]{cursor:pointer}
.sewmap g[data-sew]:focus{outline:none}
.szoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:2px;overflow:hidden;box-shadow:var(--shadow)}
.szoom button{appearance:none;border:0;border-top:1px solid var(--rule);background:var(--panel);color:var(--ink-2);width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer;font-family:inherit}
.szoom button:first-child{border-top:0}
.szoom button:hover{color:var(--mark)}
.scard{position:absolute;left:8px;bottom:8px;max-width:min(330px,calc(100% - 62px));background:var(--panel);border:1px solid var(--rule);border-left:2px solid var(--mark);border-radius:2px;padding:10px 30px 10px 12px;font-size:13px;box-shadow:0 2px 10px rgba(6,19,26,.22)}
.scard .x{position:absolute;top:1px;right:1px;background:none;border:0;color:var(--ink-3);font-size:16px;cursor:pointer;padding:4px 8px;line-height:1}
.scard .x:hover{color:var(--mark)}
.scard .meta{font-size:11px;color:var(--ink-3);margin-top:2px}
.scard .meta2{font-size:12px;color:var(--ink-2);margin-top:6px}
.scard .links{display:flex;gap:14px;margin-top:8px}
.scard .links a{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:650;color:var(--mark);text-decoration:none;font-family:ui-monospace,Menlo,monospace}
.scard .links a:hover{text-decoration:underline}
.osm{position:absolute;right:0;bottom:0;font-size:9px;color:var(--ink-2);background:var(--panel);opacity:.85;padding:1px 6px;border-radius:2px 0 0 0;pointer-events:none}
.sewlist{padding:4px 16px 6px;border-top:1px solid var(--rule-soft)}
.srow{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:8px 0;border-top:1px solid var(--rule-soft);font-size:13px;cursor:pointer}
.srow:hover .who b{color:var(--mark)}
.srow:first-child{border-top:0}
.srow .who{flex:1 1 auto;min-width:150px}
.srow .who b{font-weight:600}
.srow .who .meta{display:block;font-size:11px;color:var(--ink-3)}
.srow .dist{white-space:nowrap;color:var(--ink-2);font-size:12px}
.srow .note{white-space:nowrap;color:var(--ink-2);font-size:12px}
.sw{flex:0 0 auto;font-size:9.5px;letter-spacing:.12em;font-weight:700;font-family:ui-monospace,Menlo,monospace;padding:1px 5px;border-radius:2px;align-self:center}
.sw.active{background:var(--mark);color:#fff}
.sw.recent{background:var(--amber);color:#fff}
:root[data-theme="night"] .sw.recent{color:#06131A}
.sw.idle{background:var(--drying);color:var(--ink)}
:root[data-theme="night"] .sw.idle{color:#CFE2C2}
.sw.offline{background:none;border:1px dashed var(--rule);color:var(--ink-3)}
.sewmore{padding:9px 0 4px;font-size:11.5px;color:var(--ink-3)}
.legend i.dotl{width:8px;height:8px;border-radius:50%}

/* ---------- tidal stream / data-source notes ---------- */
.tstrip{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:13px;border-top:1px solid var(--rule-soft);padding-top:11px}
.tstrip .eyebrow{flex-basis:100%;margin-bottom:5px}
.tsc{flex:1 0 40px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tsc .th{font-size:9.5px;color:var(--ink-3)}
.tsc .tv{font-size:12px}
.tsc .arrow{margin:0}
.srcnote{font-size:10.5px;color:var(--ink-3);margin-top:10px;line-height:1.5}

/* ---------- synoptic chart ---------- */
.synwrap{overflow-x:auto;background:#fff;scrollbar-width:thin}
.synwrap a{display:block;width:max-content;margin:0 auto}
.synwrap img{display:block;height:min(90vw,460px);width:auto;max-width:none}
:root[data-theme="night"] .synwrap{background:#10171b}
:root[data-theme="night"] .synwrap img{filter:brightness(.84)}
.synerr{padding:28px 16px;font-size:13px;color:var(--ink-2)}

/* ---------- notices / footer ---------- */
.notice{border:1px solid var(--rule);border-left:2px solid var(--mark);background:var(--panel);padding:12px 14px;border-radius:2px;font-size:13px;color:var(--ink-2);margin:16px 0}
.notice b{color:var(--ink);font-weight:600}
.notice button{margin-top:8px}
footer{padding:22px 0 40px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
footer a{color:var(--ink-2)}
.empty{text-align:center;padding:64px 20px}
.empty p{color:var(--ink-2);margin:10px 0 18px;font-size:14px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,19,26,.45);z-index:60;display:none}
.scrim.open{display:block}
.sheet{
  position:fixed;z-index:61;background:var(--paper);border:1px solid var(--rule);
  left:0;right:0;bottom:0;max-height:88vh;border-radius:10px 10px 0 0;
  display:none;flex-direction:column;overflow:hidden;
}
.sheet.open{display:flex}
@media(min-width:640px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;border-radius:4px;max-height:82vh}
}
.shd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--rule)}
.shd h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:650}
.sbody{overflow-y:auto;padding:16px 18px 24px}
.fld{margin-bottom:16px}
.fld label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px;font-family:ui-monospace,Menlo,monospace}
.fld .hint{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
input[type=text],input[type=number]{
  width:100%;padding:10px 11px;border:1px solid var(--rule);background:var(--panel);
  color:var(--ink);border-radius:2px;font-size:15px;font-family:inherit;
}
input:focus-visible,button:focus-visible,.place:focus-visible{outline:2px solid var(--mark);outline-offset:1px}
.res{list-style:none}
.res li{border-top:1px solid var(--rule-soft)}
.res li:first-child{border-top:0}
.res button{
  width:100%;text-align:left;background:none;border:0;padding:11px 2px;cursor:pointer;color:var(--ink);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:inherit;font-size:14px;
}
.res button:hover{color:var(--mark)}
.res .meta{font-size:11px;color:var(--ink-3);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--panel);border:1px solid var(--rule);border-radius:99px;padding:5px 11px;
  font-size:12.5px;cursor:pointer;color:var(--ink-2);font-family:inherit;
}
.chip:hover{border-color:var(--mark);color:var(--mark)}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--rule-soft)}
.mrow:first-child{border-top:0}
.mrow .info{flex:1;min-width:0}
.mrow .info b{display:block;font-size:14px;font-weight:600}
.mrow .info span{font-size:11px;color:var(--ink-3)}
.mrow input[type=number]{width:84px;padding:6px 8px;font-size:13px}
.mrow .rm{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.mrow .rm:hover{color:var(--mark)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin:-16px -18px 16px;padding:0 18px}
.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;padding:12px 0;margin-right:20px;cursor:pointer;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:650;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace;
}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}

const Store = (() => {
  const mem = {};
  const hasArtifact = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
  return {
    async get(key){
      if (hasArtifact){
        try { const r = await window.storage.get(key); return r && r.value ? JSON.parse(r.value) : null; }
        catch { return null; }
      }
      try { const v = window.localStorage.getItem(key); return v ? JSON.parse(v) : null; }
      catch { return mem[key] ?? null; }
    },
    async set(key, val){
      const s = JSON.stringify(val);
      mem[key] = val;
      if (hasArtifact){ try { await window.storage.set(key, s); } catch {} return; }
      try { window.localStorage.setItem(key, s); } catch {}
    }
  };
})();

/* The Met Office UKV model (2 km grid) resolves headlands and estuaries the

/* Beach layers: Environment Agency designated bathing waters with their

function bwUrl(p, km){

const REFRESH_MS = 10 * 60 * 1000;
const FETCH_TIMEOUT = 14000;

/* ==================================================================

   ================================================================== */
let state = { places: SEED.slice(), activeId: "seaview", theme: "chart", window: 48, sewKm: 10, syn: "now", rain: false, beach: true };
let data  = {};   // id -> { weather, marine, fetchedAt, error }
let ticker = null, resizeTimer = null, searchTimer = null;

/* ==================================================================
   Small helpers
   ================================================================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));

// Open-Meteo returns naive local timestamps plus an offset. Convert to true
// epoch so everything is comparable, then format back in the place's own time.
const epochOf = (iso, off) => Date.parse(iso + ":00Z") - off*1000;
const fmtT = (ep, off) => { const d = new Date(ep + off*1000); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()); };
const fmtD = (ep, off) => { const d = new Date(ep + off*1000); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()] + " " + d.getUTCDate(); };
const dayKey = (ep, off) => { const d = new Date(ep + off*1000); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); };

function dur(ms){
  if (ms < 0) ms = 0;
  const m = Math.round(ms/60000), h = Math.floor(m/60);
  return h > 0 ? h + "h " + pad(m%60) + "m" : m + "m";
}
function nearestIdx(times, off){
  if (!times || !times.length) return -1;
  let best = -1, bd = Infinity, now = Date.now();
  for (let i = 0; i < times.length; i++){
    const dd = Math.abs(epochOf(times[i], off) - now);
    if (dd < bd){ bd = dd; best = i; }
  }
  return best;
}
const compass = d => ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"][Math.round(((d%360)+360)%360/22.5)%16];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDM = (ep, off) => { const d = new Date(ep + off*1000); return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()]; };
const titleCase = s => s ? String(s).toLowerCase().replace(/(^|[\s(/-])[a-z]/g, m => m.toUpperCase()) : "";

function uvWord(v){
  if (!(v >= 0)) return "";
  return v < 3 ? "low" : v < 6 ? "moderate" : v < 8 ? "high" : v < 11 ? "very high" : "extreme";
}

// Moon phase and the springs/neaps rhythm, computed locally — no API has to
// tell us where the moon is. Reference new moon: 2000-01-06 18:14 UTC.
function moonInfo(now){
  const syn = 29.530588853;
  const age = (((now - 947182440000) / 86400000) % syn + syn) % syn;
  const names = ["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon","Waning gibbous","Last quarter","Waning crescent"];
  const name = names[Math.floor(((age + syn/16) % syn) / (syn/8))];
  // Distance from the nearest syzygy (new or full), when spring tides follow.
  const half = syn / 2;
  const d = Math.min(age % half, half - (age % half));
  const tides = d < 3 ? "spring tides" : Math.abs(d - half/2) < 3 ? "neap tides" : "mid cycle";
  return { name, tides };
}

function distBrg(lat1, lon1, lat2, lon2){
  const toR = Math.PI/180;
  const dLat = (lat2-lat1)*toR, dLon = (lon2-lon1)*toR;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*toR)*Math.cos(lat2*toR)*Math.sin(dLon/2)**2;
  const y = Math.sin(dLon)*Math.cos(lat2*toR);
  const x = Math.cos(lat1*toR)*Math.sin(lat2*toR) - Math.sin(lat1*toR)*Math.cos(lat2*toR)*Math.cos(dLon);
  return { d: 2*6371*Math.asin(Math.sqrt(a)), b: (Math.atan2(y,x)*180/Math.PI+360)%360 };
}

function beaufort(kn){
  const t=[1,4,7,11,17,22,28,34,41,48,56,64];

  const n=["Calm","Light air","Light breeze","Gentle breeze","Moderate breeze","Fresh breeze","Strong breeze","Near gale","Gale","Strong gale","Storm","Violent storm","Hurricane force"];
  return { f, name:n[f] };
}
function douglas(m){
  if (!(m > 0)) return { d:0, name:"Calm, glassy" };

  let i=0; for(let k=0;k<t.length;k++) if(m>=t[k][0]) i=k;
  return { d:i+1, name:t[i][1] };
}

const WMO = {

};
function wxInfo(code, isDay){

/* ==================================================================
   Fetching
   ================================================================== */
async function jget(url){
  // Note: no AbortSignal. The artifact sandbox proxies fetch across a frame
  // boundary and an AbortSignal is not structured-cloneable, which fails the
  // request outright. A plain race gives the same timeout without the option.
  let timer;
  const timeout = new Promise((_, rej) => {
    timer = setTimeout(() => rej(new Error("Timed out after " + Math.round(FETCH_TIMEOUT/1000) + "s")), FETCH_TIMEOUT);
  });
  try {
    const r = await Promise.race([ fetch(url), timeout ]);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (j && j.error) throw new Error(j.reason || "API error");
    return j;
  } finally { clearTimeout(timer); }
}

function weatherUrl(p){
  return "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +

    "&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,visibility,is_day,pressure_msl" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,uv_index_max" +
    "&wind_speed_unit=kn&timezone=auto&forecast_days=7&past_days=1";
}

  return "https://api.open-meteo.com/v1/forecast?latitude=" + p.lat + "&longitude=" + p.lon +
    "&models=ukmo_uk_deterministic_2km" +
    "&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m" +
    "&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m" +
    "&wind_speed_unit=kn&timezone=auto&forecast_days=2";
}
function marineUrl(p){
  return "https://marine-api.open-meteo.com/v1/marine?latitude=" + p.lat + "&longitude=" + p.lon +
    "&current=sea_level_height_msl,wave_height,wave_period,wave_direction,sea_surface_temperature,ocean_current_velocity,ocean_current_direction" +
    "&hourly=sea_level_height_msl,wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction,wind_wave_height,sea_surface_temperature,ocean_current_velocity,ocean_current_direction" +
    "&daily=wave_height_max,wave_direction_dominant,wave_period_max" +
    "&timezone=auto&cell_selection=sea&forecast_days=7&past_days=1";
